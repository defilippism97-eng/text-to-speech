<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070B2C;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-mansionario"
        class="scene"
        data-composition-id="01-mansionario"
        data-composition-src="compositions/frames/01-mansionario.html"
        data-start="0"
        data-duration="7.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-scomporre"
        class="scene"
        data-composition-id="02-scomporre"
        data-composition-src="compositions/frames/02-scomporre.html"
        data-start="7"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-standard"
        class="scene"
        data-composition-id="03-standard"
        data-composition-src="compositions/frames/03-standard.html"
        data-start="17"
        data-duration="10.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-evidenze"
        class="scene"
        data-composition-id="04-evidenze"
        data-composition-src="compositions/frames/04-evidenze.html"
        data-start="27"
        data-duration="11.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-esempio"
        class="scene"
        data-composition-id="05-esempio"
        data-composition-src="compositions/frames/05-esempio.html"
        data-start="38"
        data-duration="12.6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-chiusura"
        class="scene"
        data-composition-id="06-chiusura"
        data-composition-src="compositions/frames/06-chiusura.html"
        data-start="50"
        data-duration="10"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/audio/soundtrack.wav"
        data-start="0"
        data-duration="60"
        data-track-index="11"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-mansionario", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 7);
        tl.fromTo("#el-02-scomporre", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 7);
        tl.addLabel("hf:transition:01-mansionario:02-scomporre:push-slide", 7);
        tl.to("#el-02-scomporre", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.fromTo("#el-03-standard", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 17);
        tl.addLabel("hf:transition:02-scomporre:03-standard:push-slide", 17);
        tl.to("#el-03-standard", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 27);
        tl.fromTo("#el-04-evidenze", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 27);
        tl.addLabel("hf:transition:03-standard:04-evidenze:push-slide", 27);
        tl.to("#el-04-evidenze", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 38);
        tl.fromTo("#el-05-esempio", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 38);
        tl.addLabel("hf:transition:04-evidenze:05-esempio:crossfade", 38);
        tl.to("#el-05-esempio", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 50);
        tl.fromTo("#el-06-chiusura", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 50);
        tl.addLabel("hf:transition:05-esempio:06-chiusura:blur-crossfade", 50);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
