<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #070B2C;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-la-domanda"
        class="scene"
        data-composition-id="01-la-domanda"
        data-composition-src="compositions/frames/01-la-domanda.html"
        data-start="0"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-incognita"
        class="scene"
        data-composition-id="02-incognita"
        data-composition-src="compositions/frames/02-incognita.html"
        data-start="8"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-mappa"
        class="scene"
        data-composition-id="03-mappa"
        data-composition-src="compositions/frames/03-mappa.html"
        data-start="18"
        data-duration="10.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-due-misure"
        class="scene"
        data-composition-id="04-due-misure"
        data-composition-src="compositions/frames/04-due-misure.html"
        data-start="28"
        data-duration="12.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-quadranti"
        class="scene"
        data-composition-id="05-quadranti"
        data-composition-src="compositions/frames/05-quadranti.html"
        data-start="40"
        data-duration="12.6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-chiusura"
        class="scene"
        data-composition-id="06-chiusura"
        data-composition-src="compositions/frames/06-chiusura.html"
        data-start="52"
        data-duration="8"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/audio/soundtrack.wav"
        data-start="0"
        data-duration="60"
        data-track-index="11"
        data-volume="1"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-la-domanda", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.fromTo("#el-02-incognita", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 8);
        tl.addLabel("hf:transition:01-la-domanda:02-incognita:push-slide", 8);
        tl.to("#el-02-incognita", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.fromTo("#el-03-mappa", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.addLabel("hf:transition:02-incognita:03-mappa:push-slide", 18);
        tl.to("#el-03-mappa", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.fromTo("#el-04-due-misure", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 28);
        tl.addLabel("hf:transition:03-mappa:04-due-misure:crossfade", 28);
        tl.to("#el-04-due-misure", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 40);
        tl.fromTo("#el-05-quadranti", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 40);
        tl.addLabel("hf:transition:04-due-misure:05-quadranti:crossfade", 40);
        tl.to("#el-05-quadranti", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 52);
        tl.fromTo("#el-06-chiusura", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 52);
        tl.addLabel("hf:transition:05-quadranti:06-chiusura:blur-crossfade", 52);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
